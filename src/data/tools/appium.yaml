bestFor: Cross-platform mobile and desktop automation using WebDriver protocol with any language
description: "Open source automation framework based on WebDriver protocol for testing mobile, desktop, and web applications. Supports native, hybrid, and mobile web apps across iOS, Android, Windows, and Mac. Version 4.0 is a breaking major: unused server CLI arguments were removed, standard capability names are matched case-sensitively, the Windows driver is replaced by WinCore, and remaining JSONWP/MJSONWP internals were dropped. The current release is 4.0.1 (23 November 2026), which gives each createSession its own plugin instances, releases the manifest lock while a driver or plugin script runs, removes a session before its driver finishes deleting it, and bounds BiDi subscription state."
whenToUse: When you need cross-platform mobile testing in your preferred programming language or want to leverage existing WebDriver/Selenium knowledge.
