bestFor: Self-hosted, pluggable generation of SDKs, CLIs, and docs from OpenAPI in CI
description: Open source, schema-first code generation pipeline from Cloudflare. Resolves OpenAPI 3.x specifications, applies JSONPath-based overlays, and uses chainable plugins to generate typed SDKs, CLIs, runtime helpers, and documentation, with MCP servers among the planned outputs. Announced in September 2026 and still early; its first production output is Cloudflare's cf CLI.
whenToUse: When you want to run SDK, CLI, and docs generation yourself in CI instead of relying on a hosted generator, need preview builds of generated outputs on every API change, or want to write custom generation targets.
