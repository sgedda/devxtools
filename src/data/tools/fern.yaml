description: Developer-first platform for building APIs. Define your API once in Fern's simple format and generate SDKs, documentation, and server boilerplate. Supports OpenAPI import. Acquired by Postman in January 2026 and continues as a standalone product.
whenToUse: When you want a unified approach to SDKs and documentation, prefer code-first over spec-first, or need server code generation alongside client SDKs.
seeAlso: "In November 2026, Postman [said](https://blog.postman.com/fern-is-postmans-new-home-for-api-dev-portals/) it is consolidating public Developer Portals and SDK generation on Fern, and that Postman customers get a dedicated free Fern plan worth $3,000 a year. The same post states that Postman acquired Fern and Liblab."
