name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate catalog
        run: npm run validate
      
      - name: Validate demos
        run: npm run validate:demos
      
      - name: Run tests
        run: npm test
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run viewport overflow tests
        run: npx playwright test viewport-overflow.spec.ts
      
      - name: Build site
        run: npm run build
      
      - name: Check for build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          echo "Build successful, dist directory exists"
      
      - name: Run smoke tests on built site
        run: npx playwright test picker-smoke.spec.ts --config playwright.config.ts
        env:
          CI: true
      
      - name: Check H1 counts
        run: bash scripts/check-h1-counts.sh

  test-demos:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        demo: [msw-vitest, faker-factories]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: demos/${{ matrix.demo }}/package.json
      
      - name: Install dependencies
        run: npm install
        working-directory: demos/${{ matrix.demo }}
      
      - name: Run tests
        run: npm test
        working-directory: demos/${{ matrix.demo }}
