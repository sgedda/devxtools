name: Update Changelog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-releases
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/releases.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Create or update PR
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="automated-changelog-$(date +%Y%m%d)"
          
          git fetch origin main
          
          # Fetch branch if it exists (required for --force-with-lease to work on rerun)
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch $BRANCH_NAME exists, fetching..."
            git fetch origin "$BRANCH_NAME"
          fi
          
          # Force-create branch from current working tree (handles uncommitted changes on rerun)
          git switch -C "$BRANCH_NAME"
          
          # Add all changed files (releases.json and any history files)
          git add src/data/releases.json src/data/release-history/
          
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit (content identical to existing branch)"
            SKIP_PUSH=true
          else
            git commit -m "chore: update tool releases ($(date +%Y-%m-%d))"
            SKIP_PUSH=false
          fi
          
          # Push only if we committed new changes
          if [ "$SKIP_PUSH" = "false" ]; then
            # Force-push (safe for automation-owned dated branches, never pushed to main)
            git push origin "$BRANCH_NAME" --force
          fi
          
          # Check if PR exists for this branch (use jq -r with '// empty' to avoid 'null' string)
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
          
          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER already exists, updating..."
            
            # Update PR body with current changes
            gh pr edit "$PR_NUMBER" --body "Automated update of tool release versions.

          This PR updates \`src/data/releases.json\` with the latest stable releases from npm, PyPI, and GitHub.

          **Changes detected:** $(git diff HEAD~1 src/data/releases.json 2>/dev/null | grep -c '^\+.*"version"' || echo 0) version(s) updated

          ---
          🤖 Auto-generated by [update-changelog workflow](https://github.com/${{ github.repository }}/actions/workflows/update-changelog.yml)"
          else
            echo "Creating new draft PR..."
            gh pr create \
              --draft \
              --title "chore: update tool releases ($(date +%Y-%m-%d))" \
              --body "Automated update of tool release versions.

          This PR updates \`src/data/releases.json\` with the latest stable releases from npm, PyPI, and GitHub.

          ---
          🤖 Auto-generated by [update-changelog workflow](https://github.com/${{ github.repository }}/actions/workflows/update-changelog.yml)" \
              --base main \
              --head "$BRANCH_NAME"
          fi
