name: Update Changelog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-releases
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/releases.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Create or update PR
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="automated-changelog-$(date +%Y%m%d)"
          
          git fetch origin main
          
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME exists, checking it out and updating..."
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            git rebase origin/main
          else
            echo "Creating new branch $BRANCH_NAME..."
            git checkout -b "$BRANCH_NAME"
          fi
          
          git add src/data/releases.json
          git commit -m "chore: update tool releases ($(date +%Y-%m-%d))"
          git push -u origin "$BRANCH_NAME" --force-with-lease
          
          if gh pr list --head "$BRANCH_NAME" --state open | grep -q "$BRANCH_NAME"; then
            echo "PR already exists, updating..."
            gh pr edit "$BRANCH_NAME" --body "Automated update of tool release versions.

          This PR updates \`src/data/releases.json\` with the latest stable releases from npm, PyPI, and GitHub.

          **Changes detected:** $(git diff HEAD~1 src/data/releases.json | grep -c '^\+.*"version"' || echo 0) version(s) updated

          ---
          🤖 Auto-generated by [update-changelog workflow](https://github.com/${{ github.repository }}/actions/workflows/update-changelog.yml)"
          else
            echo "Creating new PR..."
            gh pr create \
              --title "chore: update tool releases ($(date +%Y-%m-%d))" \
              --body "Automated update of tool release versions.

          This PR updates \`src/data/releases.json\` with the latest stable releases from npm, PyPI, and GitHub.

          ---
          🤖 Auto-generated by [update-changelog workflow](https://github.com/${{ github.repository }}/actions/workflows/update-changelog.yml)" \
              --base main \
              --head "$BRANCH_NAME"
          fi
