name: Deploy Demo API

on:
  push:
    branches: [main]
    paths:
      - 'workers/demo-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'workers/demo-api/package-lock.json'
      
      - name: Install dependencies
        working-directory: workers/demo-api
        run: npm ci
      
      - name: Deploy to Cloudflare Workers
        working-directory: workers/demo-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2da5448d9c00373519c97d8368d08ae3
        run: npx wrangler deploy
